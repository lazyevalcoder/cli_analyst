[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "ai-data-analyst"
version = "0.1.0"
description = "CLI-based AI data analyst with knowledge graphs and code interpreter"
requires-python = ">=3.10"
dependencies = [
    "openai",
    "pandas",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[project.scripts]
analyst = "src.analyst.__main__:main"

[tool.setuptools]
packages = ["src", "src.analyst"]

[tool.ruff]
target-version = "py310"
line-length = 132
extend-exclude = ["projects", "scratch"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
# E501: line length is not enforced — long strings are inherent to LLM prompts here.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
