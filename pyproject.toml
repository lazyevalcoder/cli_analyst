[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ai-data-analyst"
version = "0.1.0"
description = "CLI-based AI data analyst with knowledge graphs and code interpreter"
requires-python = ">=3.10"
dependencies = [
    "openai",
    "pandas",
    "numpy",
]

[project.scripts]
analyst = "src.analyst.__main__:main"
